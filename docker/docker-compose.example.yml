services:
  # Copy this file and appsettings.Production.example.json to the same deployment directory.
  # Rename the settings file to appsettings.Production.json; see README.md and docs/operations.md.
  # Main bot app
  igor-bot-app:
    image: containinger/igor-bot:latest
    container_name: igor-bot-app
    volumes:
      - ./appsettings.Production.json:/app/appsettings.Production.json:ro
    restart: unless-stopped
    depends_on:
      - igor-bot-db
    environment:
      - TZ=Europe/Vienna
      - Bot__Discord__Token=<bot-token-here>
      # Override the bundled database address only when using a different MongoDB host:
      # - ConnectionStrings__MongoDB=mongodb://database-host:27017/
      # Optional System One connection: use a server root reachable from this container.
      # Recreate the app after environment changes; then enable Questionnaire screening via /config set.
      # - Bot__SystemOne__BaseUrl=http://console-host:8081
      # - Bot__SystemOne__Model=loaded
      # - Bot__SystemOne__ApiToken=<system-one-bearer-token>
      # - Bot__SystemOne__TimeoutSeconds=10
    labels:
      - traefik.enable=false
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # MongoDB to keep state
  igor-bot-db:
    image: mongo:5
    container_name: igor-bot-db
    restart: unless-stopped
    volumes:
      - ./data/mongo/db:/data/db
      - ./data/mongo/config:/data/configdb
    environment:
      - TZ=Europe/Vienna
    labels:
      - traefik.enable=false
    logging:
      options:
        max-size: "10m"
        max-file: "3"
