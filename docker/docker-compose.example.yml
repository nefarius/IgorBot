services:
  # main bot app
  igor-bot-app:
    image: containinger/igor-bot:latest
    container_name: igor-bot-app
    volumes:
      - ./appsettings.Production.json:/app/appsettings.Production.json:ro
    restart: unless-stopped
    depends_on:
      - igor-bot-db
    environment:
      - TZ=Europe/Vienna
      - Bot__Discord__Token=<bot-token-here>
      # - Bot__SystemOne__BaseUrl=http://192.168.30.187:8081
      # - Bot__SystemOne__Model=loaded
      # - Bot__SystemOne__ApiToken=<system-one-bearer-token>
    labels:
      - traefik.enable=false
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # MongoDB to keep state
  igor-bot-db:
    image: mongo:5
    container_name: igor-bot-db
    restart: unless-stopped
    volumes:
      - ./data/mongo/db:/data/db
      - ./data/mongo/config:/data/configdb
    environment:
      - TZ=Europe/Vienna
    labels:
      - traefik.enable=false
    logging:
      options:
        max-size: "10m"
        max-file: "3"
